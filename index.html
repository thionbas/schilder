<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP SCHILDER - Konfigurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-white border-b-4 border-[#064e3b] p-4 flex items-center shadow-sm">
        <div class="half-heart"></div>
        <h1 class="text-3xl font-black text-[#064e3b] ml-4 tracking-tighter">AP SCHILDER</h1>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-lg space-y-4">
            <h2 class="text-xl font-bold border-b pb-2">Einstellungen</h2>
            
            <div>
                <label class="block text-sm font-bold mb-1">Stoffklasse</label>
                <select id="subClass" class="w-full p-2 border rounded">
                    <option value="white">Wasser (Weiß)</option>
                    <option value="yellow">Gase (Gelb)</option>
                    <option value="red">Dampf (Rot)</option>
                    <option value="brown">Brennbare Stoffe (Braun)</option>
                    <option value="green">Wasser (Grün)</option>
                    <option value="blue">Luft (Blau)</option>
                    <option value="violet">Säuren/Laugen (Violett)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold mb-1">Text</label>
                <input type="text" id="mainText" class="w-full p-2 border rounded" placeholder="z.B. Stickstoff">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Signalwort</label>
                    <select id="signal" class="w-full p-2 border rounded">
                        <option value="">Keines</option>
                        <option value="GEFAHR">GEFAHR</option>
                        <option value="ACHTUNG">ACHTUNG</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Pfeil</label>
                    <select id="arrowDir" class="w-full p-2 border rounded">
                        <option value="right">Rechts →</option>
                        <option value="left">Links ←</option>
                        <option value="up">Oben ↑</option>
                        <option value="down">Unten ↓</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">GHS (max. 3)</label>
                <div id="ghsPicker" class="grid grid-cols-5 gap-2 bg-gray-50 p-2 rounded"></div>
            </div>

            <button id="pdfBtn" class="w-full bg-[#064e3b] text-white py-4 rounded-lg font-bold text-lg hover:bg-green-900 transition shadow-md">
                PDF FÜR AVERY L4776 ERSTELLEN
            </button>
        </div>

        <div class="flex flex-col items-center">
            <span class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Live-Vorschau</span>
            <div id="preview" class="preview-container">
                <div id="previewInner" class="preview-card">
                    <div id="pText" class="p-text">TEXT</div>
                    <div class="p-footer">
                        <div id="pGhs" class="p-ghs-box"></div>
                        <div id="pSignal" class="p-signal"></div>
                        <div id="pArrow" class="p-arrow">→</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
