<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AP SCHILDER - Konfigurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-white border-b-4 border-[#064e3b] p-6 flex items-center">
        <div class="logo-container"><div class="heart-full"></div></div>
        <h1 class="text-4xl font-black text-[#064e3b] tracking-tighter">AP SCHILDER</h1>
    </header>

    <main class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-lg shadow-lg space-y-4">
            <h2 class="text-xl font-bold text-gray-700">Einstellungen</h2>
            
            <div>
                <label class="block text-sm font-bold">Stoffklasse</label>
                <select id="substanceClass" class="w-full border p-2 rounded">
                    <option value="white">Wasser (Weiß)</option>
                    <option value="yellow">Gase (Gelb)</option>
                    <option value="red">Dampf (Rot)</option>
                    <option value="brown">Brennbar (Braun)</option>
                    <option value="green">Wasser (Grün)</option>
                    <option value="blue">Luft (Blau)</option>
                    <option value="violet">Säuren (Violett)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold">Inhalt</label>
                <input type="text" id="labelText" class="w-full border p-2 rounded" placeholder="z.B. Schwefelsäure">
            </div>

            <div>
                <label class="block text-sm font-bold">Signalwort</label>
                <select id="signalWord" class="w-full border p-2 rounded">
                    <option value="">Keines</option>
                    <option value="GEFAHR">GEFAHR</option>
                    <option value="ACHTUNG">ACHTUNG</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold">Pfeilrichtung</label>
                <div class="flex gap-4">
                    <label><input type="radio" name="flow" value="left"> L</label>
                    <label><input type="radio" name="flow" value="right" checked> R</label>
                    <label><input type="radio" name="flow" value="up"> O</label>
                    <label><input type="radio" name="flow" value="down"> U</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">GHS Piktogramme</label>
                <div id="ghsSelectors" class="grid grid-cols-3 gap-2"></div>
            </div>

            <div class="pt-4">
                <label class="block text-sm font-bold">Anzahl Etiketten</label>
                <input type="number" id="quantity" value="12" min="1" max="12" class="border p-2 rounded w-20">
            </div>

            <button id="downloadBtn" class="w-full bg-[#064e3b] text-white py-4 rounded font-bold text-lg hover:bg-green-800 transition">
                PDF DRUCKEN (Avery L4776REV)
            </button>
        </div>

        <div class="flex flex-col items-center justify-start pt-10">
            <span class="text-gray-400 font-bold mb-2 uppercase text-xs tracking-widest">Live-Vorschau</span>
            <div id="previewContainer" class="shadow-2xl"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
