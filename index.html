<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP SCHILDER - Chemie Etiketten Konfigurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-gray-800 font-sans">

    <header class="bg-white border-b-4 border-green-900 p-4 flex items-center shadow-md">
        <div class="logo-heart-container mr-3">
            <div class="heart-half"></div>
        </div>
        <h1 class="text-3xl font-bold text-green-900 tracking-tight">AP SCHILDER</h1>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-[400px,1fr] gap-10">
            
            <section class="bg-gray-50 p-6 rounded-lg border border-green-100 shadow-sm space-y-5">
                <h2 class="text-xl font-semibold text-green-800">1. Konfiguration</h2>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Stoffklasse (Hintergrundfarbe)</label>
                    <select id="substanceClass" class="w-full p-2 border rounded bg-white">
                        <option value="white">Hinweisschild (Weiß)</option>
                        <option value="yellow">Stickstoff / Gase (Gelb)</option>
                        <option value="red">Dampf (Rot)</option>
                        <option value="brown">Chemischer Stoff (Braun)</option>
                        <option value="green">Wasser (Grün)</option>
                        <option value="blue">Luft (Blau)</option>
                        <option value="violet">Säure / Lauge (Violett)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Etiketten-Text (wird auto-skaliert)</label>
                    <input type="text" id="labelHeading" placeholder="z.B. Schwefelsäure 98%" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Flussrichtung</label>
                    <div class="grid grid-cols-2 gap-2 text-sm bg-white p-2 border rounded">
                        <label class="flex items-center gap-2"><input type="radio" name="direction" value="left"> <span class="text-xl">←</span> Links</label>
                        <label class="flex items-center gap-2"><input type="radio" name="direction" value="right" checked> <span class="text-xl">→</span> Rechts</label>
                        <label class="flex items-center gap-2"><input type="radio" name="direction" value="up"> <span class="text-xl">↑</span> Oben</label>
                        <label class="flex items-center gap-2"><input type="radio" name="direction" value="down"> <span class="text-xl">↓</span> Unten</label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">GHS Piktogramme (Mehrfachauswahl)</label>
                    <div class="grid grid-cols-3 gap-2 mt-2 bg-white p-2 border rounded" id="ghsContainer">
                        </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Signalwort</label>
                    <select id="signalWord" class="w-full p-2 border rounded bg-white">
                        <option value="">Keines</option>
                        <option value="GEFAHR">GEFAHR</option>
                        <option value="ACHTUNG">ACHTUNG</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Anzahl Etiketten (max. 12)</label>
                    <input type="number" id="quantity" min="1" max="12" value="1" class="w-full p-2 border rounded">
                </div>

                <button id="generateBtn" class="w-full bg-green-900 text-white py-3 rounded-lg font-bold hover:bg-green-800 transition shadow">
                    PDF für Avery L4776REV herunterladen
                </button>
            </section>

            <section class="border-2 border-dashed border-gray-300 p-6 flex flex-col items-center justify-start bg-gray-50 rounded-lg">
                <h2 class="text-sm uppercase text-gray-400 mb-6 tracking-wider">Live-Vorschau (Einzeletikett)</h2>
                
                <div class="w-full max-w-[600px] shadow-2xl">
                    <div id="previewLabel" class="preview-label-base bg-white relative overflow-hidden flex flex-col border border-gray-300">
                        </div>
                </div>
                <p class="text-xs text-gray-500 mt-4">Maße: 99,1mm x 42,3mm (Entspricht Avery Zweckform L4776REV)</p>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
