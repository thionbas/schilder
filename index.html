<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP SCHILDER - Etiketten-Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-gray-900">

    <header class="border-b-4 border-[#064e3b] p-6 flex items-center bg-white shadow-sm">
        <div class="logo-half-heart mr-4"></div>
        <h1 class="text-4xl font-black text-[#064e3b] tracking-tighter">AP SCHILDER</h1>
    </header>

    <main class="max-w-6xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-2 gap-12">
        
        <section class="space-y-6 bg-gray-50 p-6 rounded-xl border border-gray-200">
            <h2 class="text-xl font-bold border-b border-green-200 pb-2 text-[#064e3b]">Konfiguration</h2>
            
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Stoffklasse</label>
                    <select id="substanceClass" class="w-full p-2 border rounded bg-white border-gray-300">
                        <option value="white">Hinweisschild (Weiß)</option>
                        <option value="yellow">Stickstoff / Gase (Gelb)</option>
                        <option value="red">Dampf (Rot)</option>
                        <option value="brown">Chemischer Stoff (Braun)</option>
                        <option value="green">Wasser (Grün)</option>
                        <option value="blue">Luft (Blau)</option>
                        <option value="violet">Säure / Lauge (Violett)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">Etiketten-Text</label>
                    <textarea id="labelText" class="w-full p-2 border rounded border-gray-300" rows="2" placeholder="Text eingeben..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">Flussrichtung (Pfeil)</label>
                    <div class="flex gap-4 p-2 bg-white border rounded border-gray-300">
                        <label class="flex items-center gap-1"><input type="radio" name="flow" value="left"> Links</label>
                        <label class="flex items-center gap-1"><input type="radio" name="flow" value="right" checked> Rechts</label>
                        <label class="flex items-center gap-1"><input type="radio" name="flow" value="up"> Oben</label>
                        <label class="flex items-center gap-1"><input type="radio" name="flow" value="down"> Unten</label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">GHS Symbole</label>
                    <div id="ghsSelectors" class="grid grid-cols-5 gap-2 bg-white p-3 border rounded border-gray-300">
                        </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Signalwort</label>
                        <select id="signalWord" class="w-full p-2 border rounded bg-white border-gray-300">
                            <option value="">Keines</option>
                            <option value="GEFAHR">GEFAHR</option>
                            <option value="ACHTUNG">ACHTUNG</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Anzahl (1-12)</label>
                        <input type="number" id="quantity" min="1" max="12" value="12" class="w-full p-2 border rounded border-gray-300">
                    </div>
                </div>
            </div>

            <button id="downloadBtn" class="w-full bg-[#064e3b] text-white py-4 rounded-lg font-bold hover:bg-green-800 transition-all shadow-lg text-lg">
                PDF für Avery L4776REV erstellen
            </button>
        </section>

        <section class="flex flex-col items-center">
            <h2 class="text-sm font-bold text-gray-400 uppercase mb-4 tracking-widest">Live-Vorschau</h2>
            <div id="previewContainer" class="w-full max-w-[500px] border shadow-2xl relative aspect-[99.1/42.3] overflow-hidden">
                </div>
            <p class="text-xs text-gray-400 mt-4 italic">Hinweis: Die PDF-Qualität ist deutlich höher als diese Web-Vorschau.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
