<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP SCHILDER - Etiketten Profi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white border-b-4 border-[#064e3b] p-6 flex items-center shadow-md">
        <div class="half-heart-logo mr-4"></div>
        <h1 class="text-4xl font-black text-[#064e3b] tracking-tighter">AP SCHILDER</h1>
    </header>

    <main class="max-w-6xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-2 gap-12">
        
        <section class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 space-y-6">
            <h2 class="text-2xl font-bold text-[#064e3b] border-b-2 border-gray-100 pb-2">Konfiguration</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-black uppercase mb-1">Stoffklasse (Farbe)</label>
                    <select id="substanceClass" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-[#064e3b] outline-none transition">
                        <option value="white">Wasser / Neutral (Weiß)</option>
                        <option value="yellow">Gase (Gelb)</option>
                        <option value="red">Dampf (Rot)</option>
                        <option value="brown">Brennbare Flüssigkeiten (Braun)</option>
                        <option value="green">Wasser (Grün)</option>
                        <option value="blue">Luft (Blau)</option>
                        <option value="violet">Säuren / Laugen (Violett)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-black uppercase mb-1">Beschriftung</label>
                    <input type="text" id="labelText" class="w-full p-3 border-2 border-gray-200 rounded-lg" placeholder="z.B. Heizung Vorlauf">
                </div>

                <div>
                    <label class="block text-sm font-black uppercase mb-1">Flussrichtung</label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="flex items-center justify-center p-2 border-2 rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="flow" value="left" class="mr-2"> ←</label>
                        <label class="flex items-center justify-center p-2 border-2 rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="flow" value="right" checked class="mr-2"> →</label>
                        <label class="flex items-center justify-center p-2 border-2 rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="flow" value="up" class="mr-2"> ↑</label>
                        <label class="flex items-center justify-center p-2 border-2 rounded-lg cursor-pointer hover:bg-gray-50"><input type="radio" name="flow" value="down" class="mr-2"> ↓</label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-black uppercase mb-1">GHS Symbole</label>
                    <div id="ghsSelectors" class="grid grid-cols-5 gap-2 bg-gray-50 p-4 rounded-lg border-2 border-dashed border-gray-200">
                        </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-black uppercase mb-1">Signalwort</label>
                        <select id="signalWord" class="w-full p-3 border-2 border-gray-200 rounded-lg">
                            <option value="">Keines</option>
                            <option value="GEFAHR">GEFAHR</option>
                            <option value="ACHTUNG">ACHTUNG</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-black uppercase mb-1">Anzahl (max 12)</label>
                        <input type="number" id="quantity" min="1" max="12" value="12" class="w-full p-3 border-2 border-gray-200 rounded-lg">
                    </div>
                </div>
            </div>

            <button id="downloadBtn" class="w-full bg-[#064e3b] text-white py-5 rounded-xl font-black text-xl hover:bg-green-800 transform hover:scale-[1.02] transition-all shadow-lg">
                PDF FÜR AVERY L4776 ERSTELLEN
            </button>
        </section>

        <section class="flex flex-col items-center">
            <h2 class="text-xs font-black text-gray-400 uppercase mb-4 tracking-[0.2em]">Live-Vorschau (Originalmaße)</h2>
            <div id="previewContainer" class="shadow-2xl relative">
                <div id="previewLabel" class="preview-label-box">
                    <div id="prevText" class="label-text-content">TEXT</div>
                    <div class="label-footer">
                        <div id="prevGHS" class="ghs-container-preview"></div>
                        <div id="prevSignal" class="signal-text-preview"></div>
                        <div id="prevArrow" class="arrow-preview">→</div>
                    </div>
                </div>
            </div>
            <p class="mt-6 text-sm text-gray-500 italic text-center">
                Die Vorschau entspricht dem Layout auf dem Avery-Bogen.<br>
                Nutze beim Drucken die Einstellung <b>"Tatsächliche Größe"</b>.
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
